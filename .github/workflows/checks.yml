name: checks

# Fast checks that run on GitHub's hosted runners. None of them compiles the submission's own
# code. The full Comparator run is too big for hosted runners; see scripts/run-comparator.sh.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"   # daily: notices if the published tarball changes or disappears

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror matches the published tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/verify-mirror.sh

  statements:
    name: Challenge matches the submission's statements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-statements.sh

  dependencies:
    name: Dependency pins are official upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-dependencies.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

  challenge:
    name: Challenge compiles against Mathlib alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib's official build cache
        run: lake exe cache get
      - name: Build only the Challenge module (imports Mathlib only)
        run: lake build Challenge
